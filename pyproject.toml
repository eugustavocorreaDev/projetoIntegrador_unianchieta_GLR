[project]
name = "rag-docs-tecnicas"
version = "0.1.0"
description = "RAG de nível de produção para documentação técnica (Tema 4) — 100% local com Ollama e Qdrant."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "httpx==0.27.2",
    "qdrant-client==1.12.1",
    "flashrank==0.2.9",
]

[project.optional-dependencies]
ui = [
    "streamlit==1.40.1",
    "httpx==0.27.2",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "ruff==0.7.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "evidencias"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Idioma padrão do FastAPI para injeção de dependências
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ingestion", "retrieval", "generation", "api", "ui", "eval"]
