name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Nenhum .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::Arquivo .env encontrado no repositório. Remova-o e troque as chaves."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # O extra "ui" (streamlit) é necessário para tests/test_ui.py não ser pulado
      - name: Instalar dependências
        run: pip install -e ".[dev,ui]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes (pytest; LLM e embeddings são dublês, sem baixar modelos)
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            coverage.xml
            pytest-report.xml

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Construir imagens da API e da interface
        run: docker compose build api frontend
