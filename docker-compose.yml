# Sobe tudo com um comando:  docker compose up --build
# Primeira execução: baixa ~2,3 GB de modelos (qwen2.5:3b + nomic-embed-text) e indexa data/raw_docs.
# Interface: http://localhost:8501 · API: http://localhost:8000/docs · Qdrant: http://localhost:6333/dashboard

name: rag-docs

x-app-env: &app-env
  OLLAMA_BASE_URL: http://ollama:11434
  QDRANT_URL: http://qdrant:6333
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
  EMBED_QUERY_PREFIX: "${EMBED_QUERY_PREFIX-search_query: }"
  EMBED_DOCUMENT_PREFIX: "${EMBED_DOCUMENT_PREFIX-search_document: }"
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:3b}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-4096}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
  LLM_SEED: ${LLM_SEED:-42}
  REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S:-180}
  QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-techdocs}
  DOCS_DIR: ${DOCS_DIR:-data/raw_docs}
  CHUNK_STRATEGY: ${CHUNK_STRATEGY:-recursive}
  CHUNK_SIZE: ${CHUNK_SIZE:-800}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
  RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
  TOP_K: ${TOP_K:-5}
  CANDIDATES_K: ${CANDIDATES_K:-20}
  RRF_K: ${RRF_K:-60}
  RERANKER_MODEL: ${RERANKER_MODEL:-ms-marco-MultiBERT-L-12}
  RERANKER_CACHE_DIR: /app/.cache/flashrank
  MIN_VECTOR_SCORE: ${MIN_VECTOR_SCORE:-0.0}
  ENABLE_INGEST_ENDPOINT: ${ENABLE_INGEST_ENDPOINT:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_DIR: /app/logs

x-api-build: &api-build
  context: .
  dockerfile: docker/api.Dockerfile

services:
  ollama:
    # 0.12.6: primeira linha estável que roda o modelo de visão qwen2.5vl (0.5.4 não roda)
    image: ollama/ollama:0.12.6
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # Com GPU NVIDIA (opcional), descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Baixa os modelos uma vez (ficam no volume ollama_data) e termina.
  # O modelo de visão (perguntas com print, ~3,2 GB) só é baixado com PULL_VISION_MODEL=true.
  ollama-pull:
    image: ollama/ollama:0.12.6
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:3b}
      PULL_VISION_MODEL: ${PULL_VISION_MODEL:-false}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama pull "$$EMBED_MODEL" && ollama pull "$$LLM_MODEL" &&
        if [ "$$PULL_VISION_MODEL" = "true" ]; then ollama pull "$$VISION_MODEL"; fi
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  # Indexa as duas estratégias de chunking (pula as que já existem) e termina
  ingest:
    build: *api-build
    image: rag-docs-api:local
    command: ["python", "-m", "ingestion.cli", "--strategy", "all", "--skip-existing", "--warmup-reranker"]
    environment: *app-env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - flashrank_cache:/app/.cache
    depends_on:
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *api-build
    image: rag-docs-api:local
    environment: *app-env
    volumes:
      - ./data:/app/data:ro
      - ./eval:/app/eval
      - ./logs:/app/logs
      - flashrank_cache:/app/.cache
    ports:
      - "8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  flashrank_cache:
